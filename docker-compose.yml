services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: opsagent
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: opsagent
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsagent"]
      interval: 5s
      retries: 10

  redis:
    image: redis:8
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.29.7
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: opsagent
      POSTGRES_PWD: localdev
      POSTGRES_SEEDS: postgres
    ports:
      - "7233:7233"

  temporal-ui:
    image: temporalio/ui:2.56.0
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "8233:8080"

  prometheus:
    image: prom/prometheus:v3.1.0
    ports:
      - "9092:9090"
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/alerts.yml:/etc/prometheus/alerts.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.5.1
    # 3000 is taken by Langfuse, so Grafana answers on 3001.
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: localdev
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ./ops/grafana-datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - grafanadata:/var/lib/grafana
      - ./ops/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/provider.yml:ro
      - ./ops/grafana-dashboard.json:/etc/grafana/provisioning/dashboards/ops-agent.json:ro

volumes:
  pgdata:
  grafanadata:
