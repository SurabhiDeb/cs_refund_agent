services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: opsagent
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: opsagent
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsagent"]
      interval: 5s
      retries: 10

  redis:
    image: redis:8
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
