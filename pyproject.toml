[project]
name = "ops-agent"
version = "0.1.0"
description = "A customer support agent that looks up orders and issues refunds"
authors = [
    { name = "Surabhi Deb", email = "54979440+SurabhiDeb@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.143.1",
    "granian>=2.8.4",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-ai>=2.55.0",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
    "sqlalchemy>=2.1.4",
    "temporalio>=1.34.0",
]

[project.scripts]
ops-agent = "ops_agent:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "testcontainers[postgres]>=4.15.0",
]

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ARG", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
exclude = ["migrations/"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

markers = [
    "grading: scores the agent against the baseline, not a pass or fail gate",
]
addopts = "-m 'not grading'"
