name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: opsagent
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: opsagent
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://opsagent:localdev@localhost:5432/opsagent
      LLM_BASE_URL: http://localhost
      LLM_API_KEY: not-a-real-key
      LLM_MODEL: anthropic/claude-haiku-5.5

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Ruff
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy .

      - name: Migrate
        run: uv run alembic upgrade head

      - name: Pytest
        run: uv run pytest

      - name: Gate
        run: uv run python -m evals.gate

  durability:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: opsagent
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: opsagent
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://opsagent:localdev@localhost:5432/opsagent
      LLM_BASE_URL: http://localhost
      LLM_API_KEY: not-a-real-key
      LLM_MODEL: anthropic/claude-haiku-5.5

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Install Temporal CLI
        run: |
          curl -sSf https://temporal.download/cli.sh | sh
          echo "$HOME/.temporalio/bin" >> "$GITHUB_PATH"

      - name: Start Temporal dev server
        run: |
          temporal server start-dev --headless &
          for i in $(seq 1 30); do
            temporal operator cluster health && break
            sleep 1
          done

      - name: Migrate
        run: uv run alembic upgrade head

      - name: Crash test
        run: ./scripts/crash_test.sh

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build -t ops-agent:ci .

      - name: Trivy vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ops-agent:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"

      - name: Trivy secrets, report only
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ops-agent:ci
          scanners: secret
          severity: HIGH,CRITICAL
          # Reports, does not block. The only hits are test keys and example
          # tokens inside third party package metadata. Secrets in our own
          # code are gated by gitleaks, and .env is kept out by .dockerignore.
          exit-code: "0"
